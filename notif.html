<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Uma Kos</title>
   <link rel="stylesheet" href="src/css/notif.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="#d2691e"/>
                    <path d="M 30 35 Q 35 25 40 35" stroke="white" stroke-width="3" fill="none"/>
                    <path d="M 60 35 Q 65 25 70 35" stroke="white" stroke-width="3" fill="none"/>
                    <circle cx="38" cy="45" r="4" fill="white"/>
                    <circle cx="62" cy="45" r="4" fill="white"/>
                    <path d="M 35 60 Q 50 70 65 60" stroke="white" stroke-width="3" fill="none"/>
                </svg>
            <span>Uma Kos</span>
        </div>
          <ul class="nav-links">
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#kos" >Kos</a></li>
                <li><div class="user-icon">👤</div></li>
            </ul>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Kos Card 1 - Accepted -->
        <div class="kos-card">
            <img src="https://via.placeholder.com/150" alt="Kos" class="kos-image">
            <div class="kos-info">
                <h3 class="kos-title">Kos Lorem</h3>
                <div class="kos-location">📍 Jawa Tengah</div>
                <div class="kos-rating">⭐5</div>
                <div class="kos-type type-perempuan">♀ Kos Perempuan</div>
            </div>
            <div class="kos-actions">
                <span class="status status-accepted">Accepted</span>
                <button class="remove-btn">✕ Remove</button>
            </div>
        </div>

        <!-- Kos Card 2 - Declined -->
        <div class="kos-card">
            <img src="https://via.placeholder.com/150" alt="Kos" class="kos-image">
            <div class="kos-info">
                <h3 class="kos-title">Kos Lorem</h3>
                <div class="kos-location">📍 Jawa Tengah</div>
                <div class="kos-rating">⭐4</div>
                <div class="kos-type type-laki">♂ Kos Laki-Laki</div>
            </div>
            <div class="kos-actions">
                <span class="status status-declined">Declined</span>
                <button class="remove-btn">✕ Remove</button>
            </div>
        </div>

        <!-- Kos Card 3 - Pending -->
        <div class="kos-card">
            <img src="https://via.placeholder.com/150" alt="Kos" class="kos-image">
            <div class="kos-info">
                <h3 class="kos-title">Kos Lorem</h3>
                <div class="kos-location">📍 Jawa Tengah</div>
                <div class="kos-rating">⭐3</div>
                <div class="kos-type type-campur">⚥ Kos Campur</div>
            </div>
            <div class="kos-actions">
                <span class="status status-pending">Pending</span>
                <button class="remove-btn">✕ Remove</button>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <button class="page-btn">‹</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">›</button>
        </div>
    </div>
</body>
</html>
