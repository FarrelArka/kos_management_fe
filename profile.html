<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kos Lorem - Uma Kos</title>
    <link rel="stylesheet" href="src/css/profile.css">
</head>
<body>
    <!-- Navbar -->
    <nav>
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="#d2691e"/>
                    <path d="M 30 35 Q 35 25 40 35" stroke="white" stroke-width="3" fill="none"/>
                    <path d="M 60 35 Q 65 25 70 35" stroke="white" stroke-width="3" fill="none"/>
                    <circle cx="38" cy="45" r="4" fill="white"/>
                    <circle cx="62" cy="45" r="4" fill="white"/>
                    <path d="M 35 60 Q 50 70 65 60" stroke="white" stroke-width="3" fill="none"/>
                </svg>
                <span>Uma Kos</span>
            </div>
            <ul class="nav-links">
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#kos">Kos</a></li>
                <li><div class="user-icon">👤</div></li>
            </ul>
        </nav>

    <!-- Detail Section -->
    <div class="detail-section">
        <div class="detail-container">
            <!-- Kos Image -->
            <div class="kos-image-container">
                <img src="https://via.placeholder.com/360x400" alt="Kos Lorem" class="kos-image-large">
            </div>

            <!-- Kos Info Detail -->
            <div class="kos-info-detail">
                <div class="kos-header">
                    <div>
                        <h1 class="kos-title">Kos Lorem</h1>
                        <div class="kos-location">📍 Jawa Tengah</div>
                    </div>
                    <div class="kos-price">Rp. 200.000/Bulan</div>
                </div>

                <div class="features-grid">
                    <div class="feature-item">Feature</div>
                    <div class="feature-item">Feature</div>
                    <div class="feature-item">Feature</div>
                    <div class="feature-item">Feature</div>
                    <div class="feature-item">Feature</div>
                    <div class="feature-item">Feature</div>
                    <div class="feature-item">Feature</div>
                    <div class="feature-item">Feature</div>
                </div>

                <div class="kos-footer-detail">
                    <div>
                        <div class="kos-rating">⭐ 4</div>
                        <div class="kos-type type-perempuan">♀ Kos Perempuan</div>
                    </div>
                    <div class="action-buttons">
                        <button class="chat-btn" onclick="handleChat()">💬 Chat</button>
                        <button class="book-btn" onclick="handleBook()">📋 Book</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reviews Section -->
        <div class="reviews-section">
            <h2>Reviews</h2>
            <textarea class="comment-box" id="commentBox" placeholder="Write down your comments here!"></textarea>
            <button class="cari-btn" onclick="sendReview()">📋 Send</button>
            <div style="clear: both; margin-bottom: 30px;"></div>

            <div id="reviewsList">
                <div class="review-item">
                    <div class="review-name">Bagas</div>
                    <div class="review-text">"Kosnya enak, banget !"</div>
                </div>

                <div class="review-item">
                    <div class="review-name">Bayu</div>
                    <div class="review-text">"Eksperiencenya bagus !"</div>
                </div>

                <div class="review-item">
                    <div class="review-name">Doni</div>
                    <div class="review-text">"Keren, ada bathtub nya loh"</div>
                </div>

                <div class="review-item">
                    <div class="review-name">Eric</div>
                    <div class="review-text">"Gong Xi Fa Cai"</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Section -->
    
    <script src="src/script/profile.js"></script>
</body>
</html>
